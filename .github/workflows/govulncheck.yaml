name: Vulnerability Scan

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "services/**/*.go"
      - "services/**/go.mod"
      - "services/**/go.sum"
      - "clients/cli/**"
      - ".github/workflows/govulncheck.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "services/**/*.go"
      - "services/**/go.mod"
      - "services/**/go.sum"
      - "clients/cli/**"
  schedule:
    # Weekly: new advisories apply to unchanged code too
    - cron: "0 6 * * 1"

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/control-plane
          - services/github-bot
          - services/secret-proxy
          - services/agent/auth-proxy
          - clients/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false

      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
