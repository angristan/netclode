name: GitHub Bot Image

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "services/github-bot/**"
      - "services/control-plane/gen/**"
      - ".github/workflows/github-bot.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "services/github-bot/**"
      - "services/control-plane/gen/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/netclode-github-bot

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # --- Test ---
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/github-bot/go.mod
          cache-dependency-path: services/github-bot/go.sum

      - name: Run tests
        working-directory: services/github-bot
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          gotestsum --junitfile test-results.xml -- -race ./...

      # --- Build ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/github-bot/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/github-bot/go.mod
          cache-dependency-path: services/github-bot/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: services/github-bot
